
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samesy-backend
    restart: always
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - .env
    environment:
      - PORT=${APP_PORT:-8000}
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./uploads:/app/uploads
      - ./.env:/app/.env
    command: uv run uvicorn main:app --reload --host ${APP_HOST:-0.0.0.0} --port ${APP_PORT:-8000}
