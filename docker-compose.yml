version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loukarver-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
      - ./uploads:/app/uploads
    command: uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
